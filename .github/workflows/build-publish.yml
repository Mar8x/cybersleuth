name: build-publish

# Build the cybersleuth image, scan with Trivy, publish to GHCR.
# PRs: build + scan only. main: build + scan + push :<sha> and :latest.
# Push targets ghcr.io/i8void and needs secret GHCR_PAT (PAT with write:packages on i8void) — cybersleuth is
# under Mar8x, so a cross-org token is required. Without the secret, only build+scan run.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  NAMESPACE: i8void
  IMAGE: cybersleuth

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (load for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'   # report-only to start; flip to '1' to gate

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [ -z "$GHCR_PAT" ]; then
            echo "::warning::GHCR_PAT not set — skipping push. Add a PAT (write:packages on i8void) to enable."
            echo "PUSH=no" >> "$GITHUB_ENV"
          else
            echo "$GHCR_PAT" | docker login "$REGISTRY" -u i8void --password-stdin
            echo "PUSH=yes" >> "$GITHUB_ENV"
          fi

      - name: Push image
        if: github.event_name != 'pull_request' && env.PUSH == 'yes'
        run: |
          docker push "${REGISTRY}/${NAMESPACE}/${IMAGE}:${{ github.sha }}"
          docker push "${REGISTRY}/${NAMESPACE}/${IMAGE}:latest"
          echo "Pushed ${REGISTRY}/${NAMESPACE}/${IMAGE} :@${{ github.sha }} + :latest"
